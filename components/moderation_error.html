<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moderation Error</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px; /* spacing between header / image / button */
        font-family: system-ui, sans-serif;
        background-color: #fff;
        padding: 24px 20px 16px 20px; /* Match modal padding */
        box-sizing: border-box;
      }
      .header {
        flex: 0 0 auto; /* fixed: never shrinks */
        font-size: 4rem;
        margin: 0;
        line-height: 1;
        cursor: default;
        user-select: none;
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .header span {
        transition: transform 0.3s ease;
        display: inline-block;
      }
      .header span:hover {
        transform: rotate(180deg);
      }
      /* Flexible middle: takes the leftover height and lets the image scale
         down into it, so the button below is always visible. */
      .image-wrap {
        flex: 1 1 auto;
        min-height: 0; /* allow shrinking below the image's natural size */
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .error-image {
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        object-fit: contain;
        animation: fade-in 0.5s ease-out;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .close-btn {
        flex: 0 0 auto; /* fixed: always pinned and visible */
        padding: 8px 16px;
        font-size: 1rem;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        background: #1976d2;
        color: #fff;
        font-family: inherit;
      }
      /* On short viewports, reclaim space from the big emoji header and padding
         so the image keeps a usable size. */
      @media (max-height: 560px) {
        body {
          padding: 12px;
          gap: 8px;
        }
        .header {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span>🙈</span>
      <span>🤷</span>
      <span>🔄</span>
    </div>
    <div class="image-wrap">
      <img id="random-image" class="error-image" alt="" />
    </div>
    <button id="close-btn" class="close-btn">Close</button>

    <script>
      const images = [
        "../assets/error/error_monster_01.webp",
        "../assets/error/error_monster_02.webp",
        "../assets/error/error_robot_01.webp",
        "../assets/error/error_robot_02.webp",
      ];

      const randomIndex = Math.floor(Math.random() * images.length);
      document.getElementById("random-image").src = images[randomIndex];

      // Close functionality
      function closeDialog() {
        try {
          const overlay = window.parent.document.getElementById("imaginer-error-modal-overlay");
          if (overlay) overlay.remove();
        } catch (e) {
          console.warn("Could not close parent dialog", e);
        }
      }

      document.getElementById("close-btn").addEventListener("click", closeDialog);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeDialog();
      });
    </script>
  </body>
</html>
